name: Build Dustline (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dustline-upload.jks"
            echo "DUSTLINE_KEYSTORE_FILE=$RUNNER_TEMP/dustline-upload.jks" >> "$GITHUB_ENV"
            echo "Keystore restored: $(stat -c%s "$RUNNER_TEMP/dustline-upload.jks") bytes"
          else
            echo "::warning::KEYSTORE_BASE64 secret is EMPTY - release APK/AAB will be UNSIGNED."
          fi

      - name: Build debug APK, release APK and release AAB
        env:
          DUSTLINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DUSTLINE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DUSTLINE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Collect the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/ || true
          cp app/build/outputs/bundle/release/*.aab dist/ || true
          ls -la dist

      - name: Upload files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dustline-build
          path: dist/*
          if-no-files-found: error

      - name: Check that release is SIGNED
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ -f dist/app-release.apk ]; then
            "$APKSIGNER" verify --print-certs dist/app-release.apk
            echo "RELEASE APK IS SIGNED - OK"
          else
            echo "::error::Release APK is UNSIGNED (app-release-unsigned.apk). Check the 4 secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            ls -la dist
            exit 1
          fi
          if jarsigner -verify dist/app-release.aab > /dev/null 2>&1; then
            echo "AAB IS SIGNED - OK"
          else
            echo "::warning::AAB could not be verified as signed."
          fi
